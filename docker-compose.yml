version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentic_postgres
    environment:
      POSTGRES_DB: agentic_data_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: agentic_ai_service
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LLM_PROVIDER=local
      - STORAGE_DIR=/app/storage
    ports:
      - "8000:8000"
    volumes:
      - shared_storage:/app/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentic_backend
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/agentic_data_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
      - FASTAPI_BASE_URL=http://ai-service:8000
      - STORAGE_UPLOAD_DIR=/app/storage/uploads
    ports:
      - "8080:8080"
    volumes:
      - shared_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentic_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  shared_storage:
